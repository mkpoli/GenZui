<div class="tune-app">
 <header class="bar">
  <h1>__GLYPH__</h1>
  <div class="seg" role="group" aria-label="Select a whole group"><button type="button" id="t-mark">Stroke</button><button type="button" id="t-kana">Kana</button></div>
  <label class="toggle"><input id="tint" type="checkbox"> Tint added part</label>
  <label class="toggle"><input id="dark" type="checkbox"> Dark</label>
  <input id="notes" type="text" placeholder="Notes (optional)">
  <button id="copy" class="primary" type="button">Copy result</button>
  <span id="copy-status" aria-live="polite"></span>
 </header>
 <figure class="stage"><svg id="big" viewBox="-300 -300 1600 1600" aria-label="The letter at full size">
  <rect id="em" class="em" x="0" y="0" width="1000" height="1000"/><line id="mid" class="guide" x1="500" x2="500" y1="0" y2="1000"/>
  <line class="guide base" x1="-300" x2="1300" y1="880" y2="880"/>
  <g id="letter" transform="matrix(1 0 0 -1 0 880)"></g></svg>
  <figcaption>Click a part to select it · Shift or Ctrl-click to add · double-click for its whole group · drag or arrows to move · frame: the em the letter is centred in</figcaption></figure>
 <div class="column">
  <section class="panel" id="stroke-panel"><h2>Stroke</h2><div class="rows" id="stroke-rows"></div></section>
  <section class="panel"><h2>Kana</h2><div class="rows" id="kana-rows"></div></section>
 </div>
 <div class="column side">
  <section class="panel" id="part-panel"><h2 id="part-title">Parts</h2><div class="rows" id="part-rows"></div></section>
  <section class="panel"><h2>In text</h2><div id="lines"></div>
   <section id="tools"></section>
   <p class="help">Shift on a button or arrow: fine steps · double-click a name to reset it · T switches group · Esc clears the selection · <button type="button" id="reset" class="link">Reset all</button></p></section>
 </div>
</div>
