<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenZui Serif · Okinawan Regular &amp; Bold</title>
<style>
@font-face{font-family:ProofRegular;src:url(regular.woff2)}
@font-face{font-family:ProofA;src:url(bold-A.woff2);font-weight:700}
@font-face{font-family:ProofB;src:url(bold-B.woff2);font-weight:700}
@font-face{font-family:ProofC;src:url(bold-C.woff2);font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#18231f;font:16px/1.5 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:32px 0 10px}p{margin:0 0 18px;color:#536359}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 0}button{font:inherit;border:1px solid #ccd5cd;border-radius:6px;background:white;padding:7px 12px;cursor:pointer;color:inherit}button:hover{border-color:#38604d}button[aria-pressed=true]{background:#38604d;color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid #d8dfd6;background:white;border-radius:10px;padding:18px;min-width:0}.card.selected{border:2px solid #38604d;padding:17px}.card header{min-height:42px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.regular{background:#eef2ea}.glyph{display:block;width:100%;height:auto;aspect-ratio:1;color:#111}.glyph text{font-size:1000px;fill:#111}.voiced{font-size:42px;text-align:center;line-height:1.4;color:#111}.sample{font-size:32px;line-height:1.6;text-align:center;color:#111;white-space:nowrap}.reg{font-family:ProofRegular}.a{font-family:ProofA;font-weight:700}.b{font-family:ProofB;font-weight:700}.c{font-family:ProofC;font-weight:700}.status{color:#536359;font-size:14px}textarea{width:100%;min-height:180px;margin:12px 0;font:13px monospace}.links{display:flex;gap:14px;flex-wrap:wrap}.links a{color:#38604d;text-decoration:none}.notice{font-size:14px;margin-top:4px}@media(max-width:700px){main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.sample{font-size:27px}.card{padding:10px}.card.selected{padding:9px}.card header{flex-wrap:wrap}}
</style>
<main><h1>Okinawan · Regular &amp; Bold</h1><p id="intro"></p><nav class="links" aria-label="Characters"></nav><div class="toolbar"><button id="copy">Copy Bold choices</button><span class="status" role="status" id="status">Bold B is selected initially.</span></div><textarea id="fallback" hidden aria-label="Bold choices"></textarea><div id="rows"></div></main>
<script>
const data={{DATA}},key='genzui-okinawan-bold-0118',choices={};try{Object.assign(choices,JSON.parse(localStorage.getItem(key)||'{}'))}catch{}
const variants={A:'Lighter',B:'Standard',C:'Fuller'};
document.querySelector('#intro').textContent=`GenZui Serif ${data.version}. Regular is approved. Compare the Bold options with their Noto kana neighbours.`;
document.querySelector('.links').innerHTML=data.glyphs.map(g=>`<a href="#${g.label}">${g.label}</a>`).join('');
function specimen(g, cls){return `<svg class="glyph ${cls}" viewBox="0 0 1000 1000" role="img" aria-label="${g.label}"><line x1="20" x2="980" y1="880" y2="880" stroke="#d8dfd6" stroke-width="2"/><text x="0" y="880">${g.character}</text></svg><div class="sample ${cls}">${g.neighbours[0]}${g.character}${g.neighbours[1]}</div>${g.voiced?`<div class="voiced ${cls}" aria-label="Voiced form">${g.voiced}</div>`:''}`}
function render(){document.querySelector('#rows').innerHTML=data.glyphs.map(g=>{const selected=choices[g.label]||'B';return `<section id="${g.label}"><h2>${g.label}</h2><div class="cards"><article class="card regular"><header><b>Regular</b><span class="status">Approved</span></header>${specimen(g,'reg')}</article>`+Object.entries(variants).map(([id,title])=>`<article class="card ${selected===id?'selected':''}"><header><b>Bold ${id} · ${title}</b><button aria-pressed="${selected===id}" data-char="${g.label}" data-option="${id}">${selected===id?'Selected':'Choose'}</button></header>${specimen(g,id.toLowerCase())}</article>`).join('')+'</div></section>'}).join('');document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{choices[b.dataset.char]=b.dataset.option;localStorage.setItem(key,JSON.stringify(choices));render();document.querySelector('#status').textContent=`${b.dataset.char}: Bold ${b.dataset.option} selected.`})}
render();document.querySelector('#copy').onclick=async()=>{const text=JSON.stringify({version:data.version,style:'Bold',choices:Object.fromEntries(data.glyphs.map(g=>[g.label,choices[g.label]||'B']))},null,2);try{await navigator.clipboard.writeText(text);document.querySelector('#status').textContent='Bold choices copied.'}catch{const box=document.querySelector('#fallback');box.hidden=false;box.value=text;box.select()}};
</script></html>
